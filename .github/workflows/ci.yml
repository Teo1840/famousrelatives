name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Solo lectura: el CI no necesita escribir en el repo.
permissions:
  contents: read

# Si llega otro push a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extensión (ESLint + manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Validar manifest.json
        run: |
          node -e '
            const m = require("./extension/manifest.json");
            if (m.manifest_version !== 3) throw new Error("manifest_version debe ser 3");
            if (!/^\d+(\.\d+){0,3}$/.test(m.version)) throw new Error("version inválida: " + m.version);
            console.log("manifest OK, versión", m.version);
          '

      - name: Armar el zip de la extensión
        run: cd extension && zip -r -q ../famousrelatives-extension.zip . -x '*.DS_Store' 'desktop.ini'

      - uses: actions/upload-artifact@v7
        with:
          name: famousrelatives-extension
          path: famousrelatives-extension.zip
          retention-days: 14

  python:
    name: Python (pytest + flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -v

      - name: flake8
        run: flake8 .

  secretos:
    name: Buscar secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Revisa los archivos del repo en busca de tokens, cookies y contraseñas.
      # Las excepciones (la anon key pública de Supabase) están en .gitleaks.toml.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner
