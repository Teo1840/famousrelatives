<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Famous Relatives - Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f4;
      --text: #222;
      --input-bg: #fff;
      --input-border: #ccc;
      --btn-bg: #007bff;
      --btn-hover: #0056b3;
      --success: green;
      --error: #c0392b;
    }

    body.dark-mode {
      --bg: #0f1115;
      --text: #e4e6eb;
      --input-bg: #1c1f26;
      --input-border: #2a2f3a;
      --btn-bg: #84b943;
      --btn-hover: #6a9735;
      --success: #84b943;
      --error: #e57373;
    }

    body {
      font-family: "Open Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding-top: 50px;
      transition: background 0.3s, color 0.3s;
    }

    input {
      padding: 10px;
      font-size: 1em;
      margin: 5px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: 6px;
    }

    button {
      padding: 10px;
      font-size: 1em;
      margin: 5px;
      background: var(--btn-bg);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: var(--btn-hover); }

    .error-text { color: var(--error); }
    h1 { display: inline-flex; align-items: center; gap: 10px; }
    .icon { flex-shrink: 0; }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark-mode");
    }
  </script>
  <h1><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Iniciar sesión</h1>
  {% if error %}
    <p class="error-text">{{ error }}</p>
  {% endif %}
  <form method="POST" action="/login">
    <input type="text" name="username" placeholder="Usuario" required size="30">
    <br>
    <input type="password" name="personal_id" placeholder="Tu ID de FamilySearch (se usa como contraseña)" required size="30">
    <br>
    <button type="submit">Iniciar sesión</button>
  </form>
  <p><a href="{{ url_for('register') }}">Crear una cuenta</a></p>
</body>
</html>
