<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Famous Relatives - Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f4;
      --text: #222;
      --input-bg: #fff;
      --input-border: #ccc;
      --btn-bg: #007bff;
      --btn-hover: #0056b3;
      --success: green;
      --error: #c0392b;
    }

    body.dark-mode {
      --bg: #0f1115;
      --text: #e4e6eb;
      --input-bg: #1c1f26;
      --input-border: #2a2f3a;
      --btn-bg: #84b943;
      --btn-hover: #6a9735;
      --success: #84b943;
      --error: #e57373;
    }

    body {
      font-family: "Open Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding-top: 50px;
      transition: background 0.3s, color 0.3s;
    }

    input {
      padding: 10px;
      font-size: 1em;
      margin: 5px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: 6px;
    }

    button {
      padding: 10px;
      font-size: 1em;
      margin: 5px;
      background: var(--btn-bg);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: var(--btn-hover); }

    .error-text { color: var(--error); }
    button:disabled { opacity: .6; cursor: default; }
    details { margin-top: 24px; }
    summary { cursor: pointer; }
    h1 { display: inline-flex; align-items: center; gap: 10px; }
    .icon { flex-shrink: 0; }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark-mode");
    }
  </script>
  <h1><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Iniciar sesión</h1>
  <p>Entrá con tu cuenta de FamilySearch. Se abre en una pestaña nueva y, al iniciar sesión, volvés acá.</p>
  {% if error %}
    <p class="error-text">{{ error }}</p>
  {% endif %}
  <button id="btn-login-fs" type="button">Iniciar sesión con FamilySearch</button>
  <p id="login-status" aria-live="polite"></p>

  <details>
    <summary>Pegar token manualmente</summary>
    <form method="POST" action="/login">
      <input type="text" name="token" placeholder="Pegá aquí tu token..." required size="30">
      <br>
      <button type="submit">Entrar</button>
    </form>
  </details>

  <script>
  (function () {
    const btn = document.getElementById('btn-login-fs');
    const status = document.getElementById('login-status');
    let polling = null;

    function fail(msg) {
      clearInterval(polling);
      status.className = 'error-text';
      status.textContent = msg;
      btn.disabled = false;
    }

    function poll() {
      fetch('/capture-status').then(r => r.json()).then(data => {
        if (data.state === 'done') {
          clearInterval(polling);
          status.className = '';
          status.textContent = 'Sesión iniciada. Cargando...';
          location.href = '/';
        } else if (data.state === 'error' || data.state === 'timeout') {
          fail(data.error || 'No se pudo iniciar sesión.');
        }
      }).catch(() => {});
    }

    function start() {
      btn.disabled = true;
      status.className = '';
      status.textContent = 'Abriendo FamilySearch...';
      fetch('/capture-token', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
          if (!data.started) return fail(data.error || 'No se pudo abrir FamilySearch.');
          status.textContent = 'Esperando que inicies sesión en FamilySearch...';
          clearInterval(polling);
          polling = setInterval(poll, 1500);
        })
        .catch(() => fail('No se pudo abrir FamilySearch.'));
    }

    btn.addEventListener('click', start);
    {% if auto_start %}start();{% endif %}
  })();
  </script>
</body>
</html>
