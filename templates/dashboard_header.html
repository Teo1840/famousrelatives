<style>
  .header-actions {
    position: absolute;
    top: 22px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-menu {
    position: relative;
  }

  .btn-actions-toggle {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--chip-bg, #e0e0e0);
    color: var(--chip-text, #333);
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }

  .btn-actions-toggle:hover,
  .btn-actions-toggle.active {
    background: var(--chip-active-bg, rgb(132, 185, 67));
    color: var(--chip-active-text, white);
  }

  /* Punto rojo: hay personas en el CSV que todavía no se buscaron */
  .btn-actions-toggle,
  #btn-buscar-nuevas {
    position: relative;
  }

  .has-dot::after {
    content: "";
    position: absolute;
    top: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e53935;
    box-shadow: 0 0 0 2px var(--popup-bg, #fff);
  }

  #btn-buscar-nuevas.has-dot::after {
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
  }

  #dashboard-actions {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    min-width: 240px;
    padding: 12px;
    border-radius: 10px;
    background: var(--popup-bg, #fff);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    z-index: 400;
  }

  /* Modo claro/oscuro dentro del menú de configuración */
  #opcion-modo-oscuro {
    justify-content: center;
    min-width: 0;
    padding: 4px 0;
  }

  #dashboard-actions.open {
    display: flex;
  }

  #dashboard-actions summary {
    list-style: none;
    cursor: pointer;
  }

  #dashboard-actions summary::-webkit-details-marker {
    display: none;
  }

  /* From Uiverse.io by Mhyar-nsi */
  .menu-btn {
    background-color: #f3f7fe;
    color: #3b82f6;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    width: 100%;
    height: 45px;
    transition: 0.3s;
    font-family: inherit;
    font-size: 0.9em;
  }

  .menu-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  #dashboard-header .icon {
    flex-shrink: 0;
  }

  .header-actions > p,
  #capture-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .menu-btn:hover {
    background-color: #3b82f6;
    box-shadow: 0 0 0 5px #3b83f65f;
    color: #fff;
  }

  .settings-menu {
    position: relative;
  }

  /* From Uiverse.io by vinodjangid07 */
  .filter {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(0, 0, 0, 0.192);
    cursor: pointer;
    box-shadow: 0px 10px 10px rgba(0, 0, 0, 0.021);
    transition: all 0.3s;
  }

  .filter svg {
    height: 16px;
    fill: rgb(77, 77, 77);
    transition: all 0.3s;
  }

  .filter:hover {
    box-shadow: 0px 10px 10px rgba(0, 0, 0, 0.11);
    background-color: rgb(59, 59, 59);
  }

  .filter:hover svg {
    fill: white;
  }

  #settings-actions {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    min-width: 200px;
    padding: 12px;
    border-radius: 10px;
    background: var(--popup-bg, #fff);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    z-index: 400;
  }

  #settings-actions.open {
    display: flex;
  }

  #settings-actions .switch-wrapper {
    min-width: 0;
    align-items: center;
  }

  #settings-actions .status-text {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 190px;
    line-height: 1.3;
  }
</style>

<div id="dashboard-header" style="text-align:center; padding: 10px;">
  <div class="header-actions">
    {% if has_token %}
      <p class="success-text" style="margin:0;"><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg> Sesión de FamilySearch activa</p>
    {% else %}
      <p style="margin:0;"><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> No tenés un token de FamilySearch guardado todavía. Ejecutá el capturador o pegá uno manualmente.</p>
    {% endif %}

    <div class="header-menu">
      <button id="btn-actions-toggle" class="btn-actions-toggle" type="button" title="Configuración" aria-label="Configuración"><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>

      <div id="dashboard-actions">
        <div class="switch-wrapper" id="opcion-modo-oscuro">
          <label class="switch">
            <input type="checkbox" id="switchDarkMode">
            <span class="slider"></span>
          </label>
          <span id="darkModeText" class="status-text">Modo claro</span>
        </div>

        <button id="btn-capture-token" class="menu-btn" type="button"><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg> Ejecutar capturador de token</button>

        {% if has_token %}
          <form method="POST" action="/famousrelatives">
            <button id="btn-buscar-nuevas" class="menu-btn" type="submit"><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Buscar personas nuevas</button>
          </form>
        {% endif %}
        <form id="form-force-refresh" method="POST" action="/famousrelatives">
          <input type="hidden" name="force_refresh" value="on">
          <button class="menu-btn" type="submit"><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Actualizar mis árboles</button>
        </form>

        <details>
          <summary class="menu-btn" style="display:flex; align-items:center; justify-content:center; text-align:center; gap:8px;"><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg> Pegar token manualmente</summary>
          <form method="POST" action="/famousrelatives" style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
            <input type="text" name="token" placeholder="Pegá aquí tu token..." style="width:100%; box-sizing:border-box;">
            <button type="submit" class="menu-btn">Guardar y procesar</button>
          </form>
        </details>

        <a id="btn-logout" href="{{ url_for('logout') }}" class="menu-btn" style="display:flex; align-items:center; justify-content:center; text-decoration:none; box-sizing:border-box; gap:8px;"><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Cerrar sesión ({{ session.username }})</a>
      </div>
    </div>
  </div>

  <div id="capture-status"></div>
  <p id="progreso-busqueda" class="procesando" hidden style="margin: 6px 0 0; font-size: 0.95rem;"></p>
</div>

<script>
(function() {
  const toggleBtn = document.getElementById('btn-actions-toggle');
  const actions = document.getElementById('dashboard-actions');

  toggleBtn.addEventListener('click', function() {
    actions.classList.toggle('open');
    toggleBtn.classList.toggle('active');
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.header-menu')) {
      actions.classList.remove('open');
      toggleBtn.classList.remove('active');
    }
  });

  // Punto rojo en "..." y en "Buscar personas nuevas" si el CSV tiene
  // personas que todavía no se consultaron. Se revisa cada 30 s, así aparece
  // al editar famosos.csv sin recargar la página.
  const buscarBtn = document.getElementById('btn-buscar-nuevas');
  function revisarPersonasNuevas() {
    fetch('/api/personas-nuevas', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(data => {
        const n = data.count || 0;
        const msg = n ? (n === 1 ? '1 persona nueva para buscar' : n + ' personas nuevas para buscar') : '';
        toggleBtn.classList.toggle('has-dot', n > 0);
        toggleBtn.title = msg || 'Configuración';
        if (buscarBtn) {
          buscarBtn.classList.toggle('has-dot', n > 0);
          buscarBtn.title = msg;
        }
      })
      .catch(() => {});
  }
  revisarPersonasNuevas();
  setInterval(revisarPersonasNuevas, 30000);

  document.getElementById('form-force-refresh').addEventListener('submit', function(e) {
    const ok = confirm(
      'Vas a volver a consultar TODAS las personas en FamilySearch, ignorando lo guardado.\n\n' +
      'Para no saturar FamilySearch, las consultas van más lentas (una cada 0.5 s), ' +
      'así que puede tardar varios minutos. Solo se puede hacer una vez cada 5 minutos.\n\n¿Continuar?'
    );
    if (!ok) e.preventDefault();
  });

  // Al cerrar sesión, borrar la copia local de los árboles (dispositivos compartidos).
  const logoutLink = document.getElementById('btn-logout');
  logoutLink.addEventListener('click', function(e) {
    if (typeof window.clearArbolesCache !== 'function') return;
    e.preventDefault();
    window.clearArbolesCache().then(function() { location.href = logoutLink.href; });
  });

  const btn = document.getElementById('btn-capture-token');
  const status = document.getElementById('capture-status');
  let polling = null;

  btn.addEventListener('click', function() {
    btn.disabled = true;
    status.classList.add('procesando');
    status.textContent = 'Iniciando capturador...';
    fetch('/capture-token', { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        if (!data.started) {
          status.classList.remove('procesando');
          status.textContent = data.error || 'No se pudo iniciar.';
          btn.disabled = false;
          return;
        }
        status.textContent = 'Esperando login en el navegador...';
        polling = setInterval(poll, 2000);
      })
      .catch(() => { status.classList.remove('procesando'); status.textContent = 'Error al iniciar.'; btn.disabled = false; });
  });

  function poll() {
    fetch('/capture-status').then(r => r.json()).then(data => {
      if (data.state === 'done') {
        clearInterval(polling);
        status.classList.remove('procesando');
        status.innerHTML = '<svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg> Token capturado. Recargando...';
        location.reload();
      } else if (data.state === 'error' || data.state === 'timeout') {
        clearInterval(polling);
        status.classList.remove('procesando');
        status.textContent = 'Error: ' + (data.error || data.state);
        btn.disabled = false;
      } else {
        status.textContent = 'Esperando login en el navegador...';
      }
    });
  }
})();
</script>
