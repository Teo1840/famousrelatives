<!-- templates/error.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Error</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ececec;
      --text: #222;
      --card-bg: #fff;
      --border: #ddd;
      --accent: #e74c3c;
    }

    body.dark-mode {
      --bg: #0f1115;
      --text: #e4e6eb;
      --card-bg: #181a20;
      --border: #2a2f3a;
      --accent: #ff6b6b;
    }

    body {
      margin: 0;
      font-family: "Open Sans", sans-serif;
      background: var(--bg);
      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 90%;

      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      font-family: "Open Sans", sans-serif;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .error-box {
      background: rgba(0,0,0,0.05);
      padding: 12px;
      border-radius: 8px;
      text-align: left;
      font-family: monospace;
      font-size: 14px;
      overflow-x: auto;
    }

    body.dark-mode .error-box {
      background: #111318;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-family: "Open Sans", sans-serif;

      transition: transform 0.15s, opacity 0.15s;
    }

    a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    h1 { display: inline-flex; align-items: center; gap: 10px; }
    .icon { flex-shrink: 0; }
  </style>
</head>

<body>
  <div class="error-card">
    <h1><svg class="icon" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> Error en el CSV</h1>

    <div class="error-box">
      <pre>{{ error }}</pre>
    </div>

    <a href="/">Volver</a>
  </div>

  <script>
    // opcional: mantener dark mode si lo usás en localStorage
    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark-mode");
    }
  </script>
</body>
</html>
