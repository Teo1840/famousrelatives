<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Famous Relatives</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Open+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/themes/dark-mode.css">
<link rel="stylesheet" href="static/css/components/buttons.css">
<link rel="stylesheet" href="static/css/components/popups.css">
<link rel="stylesheet" href="static/css/components/switches.css">
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
body {
  font-family: "Open Sans", sans-serif;
  background-color: #ececec;
  color: #222;
  margin: 0;
  padding: 0;
  transition: background-color 0.3s, color 0.3s;
}

.flex-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  margin-top: 20px;
  margin-bottom: 10px;
  font-family: "Poppins", sans-serif;
}

.status-text {
  font-size: 14px;
  user-select: none;
}

/* ======== Títulos y tarjetas ======== */
h1, h2 {
  font-family: "Poppins", sans-serif;
  font-weight: 600;
  text-align: center;
  color: #111;
  margin-top: 20px;
}

.grid-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  justify-items: center;
  margin: 20px auto;
  max-width: 1000px;
}
@media (max-width:900px){.grid-container{grid-template-columns:repeat(2,1fr);} }
@media (max-width:600px){.grid-container{grid-template-columns:1fr;}}

.card {
  cursor: pointer;
  border-radius: 10px;
  padding: 12px;
  width: 90%;
  max-width: 280px;
  text-align: center;
  background: white;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  transition: 0.2s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}
.card h3 {
  font-family: "Poppins", sans-serif;
  font-weight: 600;
  margin-bottom: 6px;
}

/* ======== Grafo ======== */
#mynetwork {
  width: 100%;
  height: 500px;
  border: 1px solid #ddd;
  margin-top: 10px;
  border-radius: 8px;
  background: #fff;
}
</style>

</head>

<body> <!-- ///////////////////BODY\\\\\\\\\\\\\\\\\\\\ -->
  
<h1>Famous Relatives</h1>
<h2>*En rosado claro se encuentran los parentescos políticos y en rosado oscuro parentescos de mi cónyuge*</h2>

<div class="flex-container">
  <!-- Switch 1: Parentescos -->
  <div class="switch-wrapper">
    <!-- From Uiverse.io by gharsh11032000 -->
    <label class="switch">
      <input type="checkbox" id="switchCoParents">
      <span class="slider"></span>
    </label>
    <span class="status-text">Parentescos de mi cónyuge</span>
  </div>

  <!-- Switch 2: Modo oscuro -->
  <div class="switch-wrapper">
    <!-- From Uiverse.io by gharsh11032000 -->
    <label class="switch">
      <input type="checkbox" id="switchDarkMode">
      <span class="slider"></span>
    </label>
    <span id="darkModeText" class="status-text">Modo claro</span>
  </div>

  <!-- BOTON DE DESCARGA -->
  <!-- From Uiverse.io by vinodjangid07 --> 
  <button class="btn-download">
    <svg class="svgIcon" viewBox="0 0 384 512" height="1em" xmlns="http://www.w3.org/2000/svg"><path d="M169.4 470.6c12.5 12.5 32.8 12.5 45.3 0l160-160c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 370.8 224 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 306.7L54.6 265.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l160 160z"></path></svg>
    <span class="icon2"></span>
    <span class="tooltip">Download</span>
  </button>
</div>

<!-- GRILLA DE TARJETAS -->
<div class="grid-container">
  {{TARJETAS}}
</div>

<!-- POPUPS -->
<div id="popup" class="popup-overlay" onclick="closePopup(event)">
  <button class="popup-nav left" onclick="prevPopup(event)">&#8592;</button>
  <button class="popup-nav right" onclick="nextPopup(event)">&#8594;</button>

  <div class="popup-content" onclick="event.stopPropagation()">
    <span class="popup-close" onclick="closePopup(event)">&times;</span>
    <div class="flex-container">
      <div id="popup-body"></div>
      <div id="mynetwork"></div>
    </div>
  </div>
</div>

<script>
// ====================
// Variables globales
// ====================
let currentIndex = 0;

// ====================
// Array de arboles reemplazado por Python
// ====================
// const arboles = {{ARBOL_JS}}; // <-- Python debe reemplazar este marcador con JSON válido

// ====================
// Funciones Popup
// ====================
function closePopup(e) {
  document.getElementById('popup').style.display = 'none';
}

function nextPopup(e) {
  e.stopPropagation();
  if(!arboles || arboles.length === 0) return;
  currentIndex = (currentIndex + 1) % arboles.length;
  showPopup();
}

function prevPopup(e) {
  e.stopPropagation();
  if(!arboles || arboles.length === 0) return;
  currentIndex = (currentIndex - 1 + arboles.length) % arboles.length;
  showPopup();
}

// ====================
// Mostrar Popup + Grafo
// ====================
function generarUUID() {
  if (typeof self.crypto?.randomUUID === 'function') {
    // Usa la función nativa si está disponible
    return self.crypto.randomUUID();
  } else {
    // Fallback: genera un UUID estilo v4 manualmente
    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
    );
  }
}

// Asignar click a todas las cards
document.querySelectorAll('.card').forEach((card, i) => {
  // Asignar un id único si no tiene
  card.dataset.id = card.dataset.id || generarUUID();

  // Listener para abrir popup
  card.addEventListener('click', (event) => {
    event.stopPropagation();
    currentIndex = i; // o usa card.dataset.id si prefieres
    showPopup();
    document.getElementById('popup').style.display = 'flex';
  });
});

function showPopup() {
  const a = arboles[currentIndex];

  // Info textual
  document.getElementById('popup-body').innerHTML = `
    <h3>${a.nombre}</h3>
    <img src="${a.portraitUrl || 'https://via.placeholder.com/200'}" width="200">
    <p><i>${a.relacion || ''}</i></p>
    <p><b>Cercanía:</b> ${a.cercania || ''}</p>
    <p>${a.extra || ''}</p>
    <pre>${a.detalle || ''}</pre>`;

  const nodes = [];
  const edges = [];

  // Nodo raíz (antepasado común) abajo, ya que usamos "DU"
  const rootId = a.antepasado_comun?.id || generarUUID();
  nodes.push({
    id: rootId,
    label: `${a.antepasado_comun?.nombre || 'Desconocido'}\n${a.antepasado_comun?.lifespan || ''}`,
    shape: 'image',
    image: a.antepasado_comun?.portraitUrl || 'https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png',
    size: 60,
    font: { size: 16 },
    color: { border: 'red', background: '#ffe6e6' }
  });

  // Rama ascendente: conectada en cadena hacia la raíz
  const ascendingNodes = (a.camino_ascendente || []).slice()//.reverse(); // invertir para que el nodo más lejano quede arriba
  let previousId = rootId;
  ascendingNodes.forEach(p => {
    const id = p.id || generarUUID();
    nodes.push({
      id,
      label: `${p.nombre}\n${p.lifespan || ''}`,
      shape: 'image',
      image: p.portraitUrl || 'https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png',
      font: { size: 16 }
    });
    edges.push({ from: id, to: previousId }); // conectar con el nodo anterior (o raíz)
    previousId = id; // siguiente nodo se conecta a este
  });

  // Rama descendente: conectada directamente a la raíz
  let previousDescId = rootId;
  (a.camino_descendente || []).forEach(p => {
    const id = p.id || generarUUID();
    nodes.push({
      id,
      label: `${p.nombre}\n${p.lifespan || ''}`,
      shape: 'image',
      image: p.portraitUrl || 'https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png',
      font: { size: 16 }
    });
    edges.push({ from: previousDescId, to: id });
    previousDescId = id;
  });

  // Renderizar con vis.js
  const container = document.getElementById('mynetwork');
  if (window.network) window.network.destroy(); // destruir grafo anterior
  const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
  // Detectar modo oscuro actual
const darkMode = document.body.classList.contains("dark-mode");
const fontColor = darkMode ? "#eee" : "#000";
const edgeColor = darkMode ? "#aaa" : "#888";

const options = {
  layout: { hierarchical: { direction: "DU", sortMethod: "directed", nodeSpacing: 150 } },
  nodes: {
    borderWidth: 2,
    shape: "image",
    brokenImage: "https://via.placeholder.com/100",
    font: { color: fontColor, size: 16, face: "Poppins" } // 👈 color de texto
  },
  edges: { smooth: false, color: { color: edgeColor } },
  physics: false
};
  window.network = new vis.Network(container, data, options);
}

// ====================
// Eventos Switches
// ====================
document.addEventListener("DOMContentLoaded", function() {
  // MOSTRAR PARENTESCOS DEL CONYUGUE
  const toggle = document.getElementById("switchCoParents");
  let hidden = false;
  toggle.addEventListener("change", function() {
    document.querySelectorAll(".card").forEach(c => {
      if (c.dataset.coParent === "true") c.style.display = hidden ? "block" : "none";
    });
    hidden = !hidden;
  });

  // MODO OSCURO
  const darkToggle = document.getElementById("switchDarkMode");
  const darkText = document.getElementById("darkModeText");
  darkToggle.addEventListener("change", function() {
    document.body.classList.toggle("dark-mode");
    darkText.textContent = document.body.classList.contains("dark-mode")
      ? "Modo oscuro"
      : "Modo claro";
  });
});
</script>
</body>
</html>
