<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Famous Relatives</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/base.css">
<link rel="stylesheet" href="static/css/components/buttons.css">
<link rel="stylesheet" href="static/css/components/popups.css">
<link rel="stylesheet" href="static/css/components/switches.css">
<script src="/static/js/vis-network.min.js"></script>
<style>
.title-row {
  position: relative;
}

.cercania-slider-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
}

#slider-maxCercania {
  width: 180px;
  accent-color: var(--switch-track-on);
}

</style>
</head>

<body>
<div class="title-row">
  <h1>Famous Relatives</h1>
  <!-- DASHBOARD_HEADER -->
</div>
<div id="color-legend">
  <span class="border-sample"></span><strong>Borde continuo</strong> — parentesco de sangre.
  <br><span class="border-sample border-sample--politico"></span><strong>Borde punteado</strong> — parentesco político: el camino pasa por un cónyuge (tuyo o de la persona famosa).
  <br>Podés filtrar los parentescos políticos desde el menú de opciones.
</div>

<div class="flex-container">
  <!-- BOTON DE DESCARGA -->
  <!-- From Uiverse.io by vinodjangid07 --> 
  <button class="btn-download">
    <svg class="svgIcon" viewBox="0 0 384 512" height="1em" xmlns="http://www.w3.org/2000/svg"><path d="M169.4 470.6c12.5 12.5 32.8 12.5 45.3 0l160-160c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 370.8 224 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 306.7L54.6 265.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l160 160z"></path></svg>
    <span class="icon2"></span>
    <span class="tooltip">Download</span>
  </button>

  <!-- SLIDER: cercanía a la familia = lado más corto del camino (1–39; el último puesto = todos) -->
  <div class="cercania-slider-wrapper">
    <label for="slider-maxCercania" class="status-text">Cercanía a la familia: <span id="maxCercaniaValue">-</span></label>
    <input type="range" id="slider-maxCercania" min="1" max="40" value="40" step="1">
  </div>

  <!-- FILTRO: árboles que pasan por un padre/abuelo (se completa con los árboles cargados) -->
  <div class="ancestro-filter-wrapper">
    <label for="filtro-ancestro" class="status-text">Pasa por:</label>
    <select id="filtro-ancestro" disabled>
      <option value="">Todas las ramas</option>
    </select>
  </div>
</div>

<!-- Topic filter chips (populated by JS) -->
<div id="topic-filters" class="flex-container"></div>
<div id="topic-description" style="display:none"></div>

<div class="flex-container">
  <span id="list-count"></span>
</div>

<!-- GRILLA DE TARJETAS -->
<div id="cards-container" class="grid-container"></div>

<!-- POPUPS -->
<div id="popup" class="popup-overlay" onclick="closePopup(event)">
  <button class="popup-nav left" onclick="prevPopup(event)">&#8592;</button>
  <button class="popup-nav right" onclick="nextPopup(event)">&#8594;</button>

  <div class="popup-content" onclick="event.stopPropagation()">
    <span class="popup-close" onclick="closePopup(event)">&times;</span>
    <div class="flex-container">
      <div id="popup-body"></div>
      <div id="mynetwork"></div>
    </div>
  </div>
</div>

<script>
// const arboles = {{ARBOL_JS}}; // <-- Python INSERT
</script>
<script src="/static/js/arboles-cache.js"></script>
<script type="module" src="/static/js/main.js"></script>
<script src="/static/js/export.js"></script>
</body>
</html>
